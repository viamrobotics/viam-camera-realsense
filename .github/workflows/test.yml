name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Which suites to run on the non-coverage legs
        type: choice
        default: all
        options: [all, unit, integration]
  # PRs for pre-merge validation; main pushes update baseline coverage
  pull_request:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: Run Tests
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    env:
      # Which suites to run: the workflow_dispatch "tests" input, or all of
      # them on pull requests and pushes.
      TESTS: ${{ inputs.tests || 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs use the image's baked default profile; the mac leg
          # takes the checked-in toolchain pin.
          - runner: github-linux-arm64-8core
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
              options: --platform linux/arm64
            coverage: false
            profile: default
          - runner: ubuntu-latest
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
              options: --platform linux/amd64
            coverage: true
            profile: default
          - runner: macos-26
            coverage: false
            profile: ./etc/conan/macos.profile

    container: ${{ matrix.container }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install conan (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config conan
          conan profile detect || true
          conan remote add viamconan https://viam.jfrog.io/artifactory/api/conan/viamconan --index 0 --force

      - name: Show conan profile
        run: conan profile show -pr:a ${{ matrix.profile }}

      - name: Install Conan dependencies
        run: >
          conan install . -o "&:with_tests=True" --build=missing
          -pr:a ${{ matrix.profile }}
          -c tools.system.package_manager:mode=install

      # bin/lint.sh prefers clang-format-19; the image ships jammy's 14,
      # which formats differently.
      - name: Install clang-format-19 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor > /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" > /etc/apt/sources.list.d/llvm19.list
          apt-get update && apt-get install -y clang-format-19

      - name: Lint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./bin/lint.sh
          if ! git diff --quiet; then
            echo -e "\033[31mError: lint produced changes. Please run './bin/lint.sh' locally and commit the results.\033[0m"
            git diff
            exit 1
          fi

      # The coverage configure below needs lcov present (find_program REQUIRED).
      - name: Install lcov (coverage leg)
        if: matrix.coverage == true
        run: apt-get update && apt-get install -y lcov

      - name: Build
        run: |
          cmake --preset conan-release ${{ matrix.coverage && '-DVIAM_REALSENSE_ENABLE_COVERAGE=ON' || '' }}
          cmake --build --preset conan-release

      - name: Run unit tests
        if: env.TESTS == 'all' || env.TESTS == 'unit'
        run: ctest --test-dir build/Release --output-on-failure -LE integration

      # End to end against a librealsense software device (test/integration_tests.cpp).
      # Linux only: the module ships for Linux, and macOS pays a 2 s
      # librealsense teardown per case.
      - name: Run integration tests
        if: runner.os == 'Linux' && (env.TESTS == 'all' || env.TESTS == 'integration')
        run: ./bin/integration-tests.sh

      # Reports on the ctest runs above; the coverage target does not run tests.
      - name: Coverage report
        if: matrix.coverage == true
        run: cmake --build --preset conan-release --target coverage

      - name: Upload coverage reports to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@v5
        with:
          files: ./build/Release/coverage.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN || '' }}
          # Report-only: an upload failure should not fail CI
          fail_ci_if_error: false
          verbose: true
